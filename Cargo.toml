[package]
name = "hnefatafl"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.14"

# Make release as small as possible
[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
lto = true
codegen-units = 1
panic = "abort"
